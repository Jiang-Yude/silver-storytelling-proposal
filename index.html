// ─── 四方關係圖 SVG ──────────────────────────────────

    elders: "#7A8B6F",
    ai: "#3D5A6C",
    school: "#D4A24C",
    line: "#2C2823",
    bg: "transparent",
    text: "#2C2823",
  };
  return (
    <svg viewBox="0 0 600 460" width="100%" style={{ display: "block", maxWidth: 560 }}>
      <circle cx="300" cy="230" r="58" fill="#fff" stroke={p.line} strokeWidth="1.5" />
      <text x="300" y="222" textAnchor="middle" fontFamily="Noto Serif TC, serif" fontSize="18" fontWeight="700" fill={p.text}>每週</text>
      <text x="300" y="248" textAnchor="middle" fontFamily="Noto Serif TC, serif" fontSize="18" fontWeight="700" fill={p.text}>30 分鐘</text>

      <g stroke={p.line} strokeWidth="1" strokeDasharray="3 4" opacity="0.4">
        <line x1="300" y1="172" x2="300" y2="80" />
        <line x1="358" y1="230" x2="500" y2="230" />
        <line x1="300" y1="288" x2="300" y2="380" />
        <line x1="242" y1="230" x2="100" y2="230" />
      </g>

      {[
        { x: 300, y: 50, color: p.kids, label: "孩子", sub: "資源班" },
        { x: 530, y: 230, color: p.elders, label: "長輩", sub: "說故事人" },
        { x: 300, y: 410, color: p.school, label: "學校", sub: "場地 · 陪同" },
        { x: 70, y: 230, color: p.ai, label: "AI", sub: "後台支援" },
      ].map((n, i) => (
        <g key={i}>
          <circle cx={n.x} cy={n.y} r="48" fill={n.color} opacity="0.15" />

          <text x={n.x} y={n.y + 16} textAnchor="middle" fontFamily="Noto Sans TC, sans-serif" fontSize="10" fill="#fff" opacity="0.85">{n.sub}</text>

      <text x="305" y="345" fontFamily="Noto Sans TC" fontSize="11" fill={p.text} opacity="0.6">外部資源</text>

// ─── 知識庫加大版 SVG ──────────────────────────────────
function KnowledgeStackLG({ palette }) {
  const p = palette;
  return (
    <svg viewBox="0 0 560 300" width="100%" style={{ display: "block" }}>
      {[0, 1, 2, 3, 4].map((i) => {
        const y = 230 - i * 28;
        const w = 380 - i * 20;
        const x = (560 - w) / 2;
        const opacity = 0.35 + i * 0.16;
        return (
          <g key={i}>
            <rect x={x} y={y} width={w} height="24" rx="2" fill={p.primary} opacity={opacity} />
            <rect x={x + 16} y={y + 9} width="44" height="2.5" fill="#fff" opacity="0.5" />
            <rect x={x + 66} y={y + 9} width="86" height="2.5" fill="#fff" opacity="0.4" />
          </g>
        );
      })}
      <g fontFamily="Noto Sans TC, sans-serif" fontSize="14" fill={p.text} opacity="0.75" fontWeight="500">
        <text x="60" y="38">現場好題材</text>
        <text x="220" y="28" textAnchor="middle">孩子的回應</text>
        <text x="380" y="38">長輩的靈感</text>
        <text x="510" y="38" textAnchor="end">老師的觀察</text>
      </g>
      <g stroke={p.line} strokeWidth="1" opacity="0.35" strokeDasharray="2 3">
        <line x1="100" y1="50" x2="180" y2="105" />
        <line x1="220" y1="40" x2="240" y2="105" />
        <line x1="400" y1="50" x2="320" y2="105" />
        <line x1="490" y1="50" x2="380" y2="105" />
      </g>
      <text x="280" y="124" textAnchor="middle" fontFamily="Noto Serif TC, serif" fontSize="17" fontWeight="700" fill={p.text}>共享知識庫</text>
      <text x="280" y="290" textAnchor="middle" fontFamily="Noto Sans TC" fontSize="14" fill={p.text} opacity="0.7">上一次的累積 = 下一次的養分</text>
    </svg>
  );
}

// ─── 加大版折疊元件 ──────────────────────────────────
function CollapsibleLG({ badge, title, children, defaultOpen, p }) {
  const [open, setOpen] = React.useState(defaultOpen);
  return (
    <div>
      <button onClick={() => setOpen(!open)} style={{
        width: "100%", textAlign: "left",
        padding: "24px 28px",
        background: open ? p.cream : "transparent",
        border: "none", cursor: "pointer",
        display: "flex", alignItems: "center", gap: 20,
        fontFamily: "inherit", color: p.ink,
        transition: "background 0.3s",
      }}>
        <span style={{
          fontFamily: '"Noto Serif TC", serif', fontSize: 18,
          color: p.accent, fontWeight: 700, letterSpacing: "0.05em", minWidth: 32,
        }}>{badge}</span>
        <span style={{
          flex: 1, fontFamily: '"Noto Serif TC", serif',
          fontSize: 24, fontWeight: 700, letterSpacing: "0.02em",
        }}>{title}</span>
        <span style={{
          width: 36, height: 36, borderRadius: "50%",
          border: `1.5px solid ${p.accent}`, color: p.accent,
          display: "inline-flex", alignItems: "center", justifyContent: "center",
          transform: open ? "rotate(45deg)" : "rotate(0deg)",
          transition: "transform 0.3s",
          fontSize: 22, lineHeight: 1, fontWeight: 300,
        }}>+</span>
      </button>
      <div style={{
        maxHeight: open ? "2000px" : "0",
        overflow: "hidden",
        transition: open ? "max-height 0.6s ease-in" : "max-height 0.3s ease-out",
        background: open ? p.cream : "transparent",
      }}>
        <div style={{ padding: "0 28px 28px 80px" }}>{children}</div>
      </div>
    </div>
  );
}

// ─── Section 包裝 ──────────────────────────────────
function CraftSection({ num, title, hand, p, children }) {
  return (
    <section style={{ padding: "60px 80px", borderTop: `1.5px dashed ${p.line}` }}>
      <div style={{ marginBottom: 44, display: "flex", alignItems: "baseline", gap: 28 }}>
        <div style={{
          fontFamily: '"Noto Serif TC", serif',
          fontSize: 64, fontWeight: 900, color: p.accent, lineHeight: 1,
        }}>{num}</div>
        <div>
          <h2 style={{ fontFamily: '"Noto Serif TC", serif', fontSize: 44, fontWeight: 700, margin: "0 0 8px", lineHeight: 1.2 }}>
            {title}
          </h2>
          <div style={{ fontFamily: "Caveat, cursive", fontSize: 28, color: p.accent2, fontWeight: 700 }}>
            {hand}
          </div>
        </div>
      </div>
      {children}
    </section>
  );
}

// ─── 主元件 ProposalCraft (B 版本，手作札記，字級加大) ──────────────────────────────────
const craftPalette = {
  bg: "#F7F1E3",
  paper: "#FFFCF5",
  cream: "#F0E6D2",
  ink: "#3A2E2A",
  inkSoft: "#6B5C50",
  accent: "#D87447",
  accent2: "#7A9560",
  accent3: "#E8B854",
  accent4: "#5B7B8A",
  postit: "#FFE89B",
  line: "rgba(58,46,42,0.2)",
  lineSoft: "rgba(58,46,42,0.1)",
};

function ProposalCraft() {
  const p = craftPalette;
  return (
    <div style={{
      width: "100%",
      maxWidth: 1080,
      background: p.bg,
      color: p.ink,
      fontFamily: '"Noto Sans TC", system-ui, sans-serif',
      fontSize: 19,
      lineHeight: 1.85,
      position: "relative",
      backgroundImage: `repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(58,46,42,0.04) 31px, rgba(58,46,42,0.04) 32px)`,
    }}>

      <section style={{ padding: "64px 80px 60px", position: "relative" }}>
        <div style={{ position: "absolute", top: 28, right: 80, width: 140, height: 32, background: p.accent, opacity: 0.85, transform: "rotate(8deg)", boxShadow: "0 2px 4px rgba(0,0,0,0.08)" }}/>
        <div style={{ position: "absolute", top: 32, right: 88, fontFamily: "Caveat, cursive", fontSize: 22, color: "#fff", transform: "rotate(8deg)", fontWeight: 700 }}>

        </div>

        <div style={{ fontFamily: "Caveat, cursive", fontSize: 38, color: p.accent, fontWeight: 700, marginBottom: 12, transform: "rotate(-1deg)" }}>

        </div>

        <h1 style={{
          fontFamily: '"Noto Serif TC", serif',

              <path d="M2,9 Q70,3 130,8 T258,7" stroke={p.accent3} strokeWidth="7" fill="none" strokeLinecap="round" opacity="0.75"/>
            </svg>
          </span><br/>
          走進校園資源班

        <div style={{
          display: "inline-flex", alignItems: "center", gap: 14,
          padding: "12px 22px",
          background: p.cream,

          borderRadius: 999,
          fontSize: 17, color: p.ink,
          marginTop: 8,
          lineHeight: 1.6,

                defaultOpen={i === 0}
                p={p}
              >
                <ul style={{ margin: 0, padding: 0, listStyle: "none" }}>
                  {layer.bullets.map((b, j) => (
                    <li key={j} style={{
                      padding: "12px 0 12px 30px", position: "relative",
                      fontSize: 18, lineHeight: 1.85,
                    }}>
                      <span style={{
                        position: "absolute", left: 0, top: 14,
                        fontFamily: "Caveat, cursive", color: p.accent2, fontWeight: 700, fontSize: 24,
                      }}>✓</span>
                      {b}
                    </li>
                  ))}
                </ul>
              </CollapsibleLG>
            </div>
          ))}
        </div>
      </CraftSection>

      {/* 03 效益 */}
      <CraftSection num="03" title="預期效益" hand="四方共贏" p={p}>
        <div style={{ display: "grid", gridTemplateColumns: "1.1fr 1fr", gap: 44, alignItems: "center", marginBottom: 52 }}>
          <div style={{
            background: p.paper, padding: "24px", borderRadius: 6,
            border: `1.5px solid ${p.ink}`, boxShadow: `3px 3px 0 ${p.accent2}`,
          }}>
            <FourWayDiagram palette={{
              kids: p.accent, elders: p.accent2, ai: p.accent4, school: p.accent3,
              line: p.ink, text: p.ink,
            }}/>
          </div>
          <div>
            <div style={{ fontFamily: "Caveat, cursive", fontSize: 34, color: p.accent, fontWeight: 700, marginBottom: 10 }}>
              ✦ 孩子是中心
            </div>
            <h3 style={{ fontFamily: '"Noto Serif TC", serif', fontSize: 34, fontWeight: 700, margin: "0 0 18px", lineHeight: 1.4 }}>
              不是單向幫助,<br/>是會自己長大的系統
            </h3>
            <p style={{ fontSize: 18, lineHeight: 1.9, color: p.ink, margin: 0 }}>
              一場故事,連起四個角色。每個角色都有自己的位置、自己的得到。
            </p>
          </div>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 22 }}>
          {PROPOSAL_DATA.benefits.map((b, i) => {
            const tints = [p.accent, p.accent2, p.accent3, p.accent4];
            const rots = [-0.8, 0.6, 0.4, -0.6];
            return (
              <div key={i} style={{
                background: i === 0 ? p.postit : p.paper,
                padding: "28px 30px",
                border: `1.5px solid ${p.ink}`, borderRadius: 6,
                boxShadow: `2px 2px 0 ${tints[i]}`,
                transform: `rotate(${rots[i]}deg)`,
              }}>
                <div style={{ display: "flex", alignItems: "baseline", gap: 14, marginBottom: 16 }}>
                  <h4 style={{ fontFamily: '"Noto Serif TC", serif', fontSize: 28, fontWeight: 700, margin: 0, color: tints[i] }}>{b.who}</h4>
                  <span style={{ fontFamily: "Caveat, cursive", fontSize: 20, color: p.inkSoft }}>· {b.sub}</span>
                </div>
                <ul style={{ margin: 0, padding: 0, listStyle: "none" }}>
                  {b.points.map((pt, j) => (
                    <li key={j} style={{
                      padding: "7px 0 7px 22px", position: "relative",
                      fontSize: 17, lineHeight: 1.8,
                    }}>
                      <span style={{ position: "absolute", left: 0, top: 14, width: 9, height: 9, background: tints[i], borderRadius: "50%", opacity: 0.7 }}/>
                      {pt}
                    </li>
                  ))}
                </ul>
              </div>
            );
          })}
        </div>

        {/* 知識庫 */}
        <div style={{
          marginTop: 60, padding: "44px 48px",
          background: p.cream, border: `1.5px solid ${p.ink}`, borderRadius: 6,
          boxShadow: `4px 4px 0 ${p.accent}`,
        }}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 44, alignItems: "center" }}>
            <div>
              <div style={{ fontFamily: "Caveat, cursive", fontSize: 30, color: p.accent, fontWeight: 700, marginBottom: 8 }}>
                整體永續性
              </div>
              <h3 style={{ fontFamily: '"Noto Serif TC", serif', fontSize: 36, fontWeight: 700, margin: "0 0 20px", lineHeight: 1.35 }}>
                會持續累加的<br/>共享知識庫
              </h3>
              <p style={{ fontSize: 17.5, lineHeight: 1.95, color: p.ink, margin: "0 0 14px" }}>
                每一場故事、每一段討論、每一個現場狀況,都會被收進共享知識庫。
              </p>
              <p style={{ fontFamily: "Caveat, cursive", fontSize: 28, color: p.ink, margin: 0, fontWeight: 700 }}>
                上一次的累積 = 下一次的養分 ✦
              </p>
            </div>
            <KnowledgeStackLG palette={{ primary: p.accent, text: p.ink, line: p.ink }}/>
          </div>
        </div>
      </CraftSection>

      {/* 04 執行 */}
      <CraftSection num="04" title="執行架構" hand="角色分工" p={p}>
        <div style={{ display: "grid", gap: 14 }}>
          {PROPOSAL_DATA.roles.map((r, i) => {
            const tints = [p.accent, p.accent2, p.accent4, p.accent3, p.inkSoft];
            return (
              <div key={i} style={{
                display: "grid", gridTemplateColumns: "auto 200px 1fr", gap: 22,
                padding: "20px 26px", alignItems: "center",
                background: p.paper,
                border: `1.5px solid ${p.ink}`, borderRadius: 6,
                boxShadow: `2px 2px 0 ${tints[i]}`,
              }}>
                <div style={{
                  width: 44, height: 44, borderRadius: "50%",
                  background: tints[i], color: "#fff",
                  display: "flex", alignItems: "center", justifyContent: "center",
                  fontFamily: "Caveat, cursive", fontSize: 24, fontWeight: 700,
                }}>{i + 1}</div>
                <div style={{ fontFamily: '"Noto Serif TC", serif', fontSize: 22, fontWeight: 700, color: p.ink }}>{r.role}</div>
                <div style={{ fontSize: 17, lineHeight: 1.8, color: p.ink }}>{r.duty}</div>
              </div>
            );
          })}
        </div>
      </CraftSection>

      {/* 結尾 */}
      <section style={{ padding: "76px 80px 92px", textAlign: "center" }}>
        <div style={{ fontFamily: "Caveat, cursive", fontSize: 42, color: p.accent, fontWeight: 700, marginBottom: 18 }}>
          ✦ 一起開始 ✦
        </div>
        <p style={{ fontFamily: '"Noto Serif TC", serif', fontSize: 28, lineHeight: 1.7, margin: 0, color: p.ink, maxWidth: 760, marginInline: "auto" }}>
          讓阿公阿嬤、AI、孩子、學校,<br/>四方都成為這個故事裡的主角。
        </p>
        <div style={{ marginTop: 40, fontSize: 16, color: p.inkSoft, letterSpacing: "0.15em" }}>
          提案 · 江昱德 / 林學賢　|　永力扶輪社
        </div>
      </section>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <div className="page-wrap"><ProposalCraft /></div>
);
</script>
</body>
</html>
